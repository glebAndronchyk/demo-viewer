# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy React app and Bun backend to App services

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  build-backend:
    name: "Build backend API and golang package"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'

      - name: Install dependencies
        run: bun install

      - name: Build demo-composer package
        run: bun run build
        working-directory: backend/demo-composer

      - name: Build API
        run: bun build ./src/index.ts --target bun --outdir ./dist --external steam-user --external steam-session --external globaloffensive --external file-manager
        working-directory: backend/api

      - name: Disable Azure Oryx build step
        run: touch .skipbuildstep

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  migrate-up:
    name: "Migrate UP database"
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run migration script
        run: bun run migrate:up
        working-directory: backend/database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          ZSTD_SUPPORT: ${{ secrets.ZSTD_SUPPORT }}

  build-frontend:
    name: "Build frontend application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build
        working-directory: frontend/demo-viewer
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Copy startup script into dist
        run: cp scripts/startup-frontend.sh frontend/demo-viewer/dist/startup-frontend.sh

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: frontend/demo-viewer/dist

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [migrate-up, build-backend]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download node-app artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C5ECA14A0A9E4D23B7C66BB9B58034E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3723739973404DF7844311A64B6AEDC7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A83FA4D5D8C40AFB53CA2A8F9FF29D1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'demo-viewer'
          package: .
          startup-command: 'bash /home/site/wwwroot/scripts/startup.sh'

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [ build-frontend ]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download web-app artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6448F01E6BB34441860082970ED407C9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7CD65BB6F655465082D43F34B6D0EC6E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3B6CF3AD23034E9A81ABE14F39F8DB93 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'demo-viewer-ui'
          package: .
          startup-command: 'bash /home/site/wwwroot/startup-frontend.sh'
          