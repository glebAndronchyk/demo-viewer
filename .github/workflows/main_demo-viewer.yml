# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - demo-viewer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  env-setup:
    name: "Environment setup"
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Set up Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.4

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Build demo-composer package
        run: bun run build
        working-directory: backend/demo-composer

      - name: Build API
        run: bun run build
        working-directory: backend/api

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  migrate-up:
    name: "Migrate UP database"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run migration script
        run: bun migrate:up
        working-directory: backend/database

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C5ECA14A0A9E4D23B7C66BB9B58034E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3723739973404DF7844311A64B6AEDC7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A83FA4D5D8C40AFB53CA2A8F9FF29D1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'demo-viewer'
          slot-name: 'Production'
          package: .
          